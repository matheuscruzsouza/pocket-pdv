# Nano-Spring Configuration
nano.nsd.enabled=true
nano.nsd.name=pocketpdv
nano.nsd.host-resolution=true
nano.dsn.name=pocketpdv

server.port=8080
nano.datasource.name=pocketpdv.db
nano.datasource.migration.enabled=false

# Swagger & OpenAPI 3.0
nano.swagger.enabled=true
nano.swagger.title=PocketPDV REST API
nano.swagger.version=1.10.0
nano.swagger.description=API REST e Web do Ponto de Venda Hibrido PocketPDV

# Actuator & Telemetria
nano.actuator.enabled=true

# Thread Pool & Timeouts (evita esgotamento de conexões mantidas abertas pelo SSE)
nano.server.threads.core=16
nano.server.threads.max=64
nano.server.threads.queue-capacity=200
nano.server.threads.keep-alive=60
nano.server.read-timeout=15000

