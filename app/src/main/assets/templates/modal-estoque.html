<div class="modal" onclick="if(event.target===this) fecharModal()">
  <div class="modal-content" style="max-width: 750px;">
    <div class="modal-header">
      <h3 class="modal-title">📦 Gestão de Estoque</h3>
      <button class="modal-close" onclick="fecharModal()">&times;</button>
    </div>

    {{#alerta}}
    <div style="background: #d1fae5; color: #065f46; padding: 0.75rem; border-radius: 0.375rem; margin-bottom: 1rem;">
      {{alerta}}
    </div>
    {{/alerta}}

    <div class="table-container" style="max-height: 280px; overflow-y: auto; margin-bottom: 1.25rem;">
      <table>
        <thead>
          <tr>
            <th>Produto</th>
            <th class="text-right">Preço</th>
            <th class="text-center">Estoque Atual</th>
            <th class="text-center">Ajustar Estoque</th>
          </tr>
        </thead>
        <tbody>
          {{#catalogo}}
          <tr>
            <td>
              <div class="font-bold">{{nome}}</div>
              <div class="font-mono" style="font-size: 0.75rem; color: #6b7280;">{{codigoBarras}}</div>
            </td>
            <td class="text-right font-bold">{{precoFormatado}}</td>
            <td class="text-center">
              <span id="modal-estoque-prod-{{id}}" style="padding: 0.2rem 0.5rem; border-radius: 0.25rem; font-size: 0.8rem; font-weight: bold; background: {{#estoqueBaixo}}#fee2e2; color: #b91c1c;{{/estoqueBaixo}}{{^estoqueBaixo}}#e5e7eb; color: #374151;{{/estoqueBaixo}}">{{estoque}} un</span>
            </td>
            <td class="text-center">
              <form hx-post="/pdv/estoque/ajuste" hx-target="#modal-container" style="display: inline-flex; gap: 4px; align-items: center;">
                <input type="hidden" name="produtoId" value="{{id}}">
                <input type="number" name="novoEstoque" value="{{estoque}}" min="0" class="form-input" style="width: 70px; padding: 0.25rem 0.4rem; font-size: 0.85rem; text-align: center;">
                <button type="submit" class="btn btn-primary" style="padding: 0.25rem 0.6rem; font-size: 0.8rem;">Salvar</button>
              </form>
            </td>
          </tr>
          {{/catalogo}}
          {{^catalogo}}
          <tr><td colspan="4" class="text-center" style="color: #9ca3af; padding: 1.5rem;">Nenhum produto cadastrado</td></tr>
          {{/catalogo}}
        </tbody>
      </table>
    </div>

    <div class="card" style="background: #f9fafb; border: 1px solid #e5e7eb; padding: 1rem;">
      <h4 style="font-size: 0.95rem; font-weight: 700; margin-bottom: 0.75rem; color: #111827;">➕ Cadastrar Novo Produto</h4>
      <form hx-post="/pdv/estoque/novo" hx-target="#modal-container" style="display: grid; grid-template-columns: 2fr 1.5fr 1fr 1fr auto; gap: 0.5rem; align-items: end;">
        <div>
          <label class="form-label" style="font-size: 0.75rem;">Nome</label>
          <input type="text" name="nome" required class="form-input" style="font-size: 0.85rem; padding: 0.35rem 0.5rem;" placeholder="Ex: Suco Laranja 1L">
        </div>
        <div>
          <label class="form-label" style="font-size: 0.75rem;">Código Barras</label>
          <input type="text" name="codigoBarras" required class="form-input font-mono" style="font-size: 0.85rem; padding: 0.35rem 0.5rem;" placeholder="Ex: 7891234567890">
        </div>
        <div>
          <label class="form-label" style="font-size: 0.75rem;">Preço (R$)</label>
          <input type="number" step="0.01" name="preco" required class="form-input" style="font-size: 0.85rem; padding: 0.35rem 0.5rem;" placeholder="8.50">
        </div>
        <div>
          <label class="form-label" style="font-size: 0.75rem;">Estoque</label>
          <input type="number" name="estoque" required class="form-input" style="font-size: 0.85rem; padding: 0.35rem 0.5rem;" placeholder="20" value="10">
        </div>
        <button type="submit" class="btn btn-primary" style="font-size: 0.85rem; padding: 0.35rem 0.8rem; white-space: nowrap;">+ Cadastrar</button>
      </form>
    </div>

    <div style="text-align: right; margin-top: 1rem;">
      <button class="btn btn-secondary" onclick="fecharModal()">Fechar</button>
    </div>
  </div>
</div>
