<div class="modal" onclick="if(event.target===this) fecharModal()">
  <div class="modal-content" style="max-width: 650px;">
    <div class="modal-header">
      <h3 class="modal-title">📊 Resumo de Vendas do Dia</h3>
      <button class="modal-close" onclick="fecharModal()">&times;</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin-bottom: 1.25rem;">
      <div class="card" style="padding: 0.85rem; text-align: center; background: #ecfdf5; border-color: #a7f3d0;">
        <div style="font-size: 0.75rem; color: #065f46; font-weight: 700; text-transform: uppercase;">Faturamento</div>
        <div style="font-size: 1.4rem; font-weight: 900; color: #065f46; margin-top: 0.25rem;">{{totalFaturamento}}</div>
      </div>
      <div class="card" style="padding: 0.85rem; text-align: center; background: #eff6ff; border-color: #bfdbfe;">
        <div style="font-size: 0.75rem; color: #1e40af; font-weight: 700; text-transform: uppercase;">Total Vendas</div>
        <div style="font-size: 1.4rem; font-weight: 900; color: #1e40af; margin-top: 0.25rem;">{{qtdVendas}}</div>
      </div>
      <div class="card" style="padding: 0.85rem; text-align: center; background: #fdf4ff; border-color: #f5d0fe;">
        <div style="font-size: 0.75rem; color: #86198f; font-weight: 700; text-transform: uppercase;">Ticket Médio</div>
        <div style="font-size: 1.4rem; font-weight: 900; color: #86198f; margin-top: 0.25rem;">{{ticketMedio}}</div>
      </div>
    </div>
    <h4 style="font-size: 0.95rem; font-weight: 700; margin-bottom: 0.5rem; color: #374151;">Últimas Vendas Realizadas</h4>
    <div class="table-container" style="max-height: 250px; overflow-y: auto; margin-bottom: 1rem;">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Data/Hora</th>
            <th class="text-right">Total</th>
            <th class="text-center">Status</th>
          </tr>
        </thead>
        <tbody>
          {{#vendas}}
          <tr>
            <td class="font-mono font-bold">#{{id}}</td>
            <td style="font-size: 0.8rem; color: #4b5563;">{{dataHora}}</td>
            <td class="text-right font-bold" style="color: #065f46;">{{totalFormatado}}</td>
            <td class="text-center"><span class="badge">{{status}}</span></td>
          </tr>
          {{/vendas}}
          {{^vendas}}
          <tr><td colspan="4" class="text-center" style="color: #9ca3af; padding: 1.5rem;">Nenhuma venda realizada ainda</td></tr>
          {{/vendas}}
        </tbody>
      </table>
    </div>
    <div style="text-align: right;">
      <button class="btn btn-secondary" onclick="fecharModal()">Fechar</button>
    </div>
  </div>
</div>
