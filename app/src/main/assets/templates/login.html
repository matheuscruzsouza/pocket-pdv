<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PocketPDV - Login</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div class="login-box">
    <div class="login-header">
      <h1 class="brand">PocketPDV</h1>
      <p style="color: #6b7280; font-size: 0.875rem;">Acesso ao Ponto de Venda</p>
    </div>

    {{#erro}}
    <div style="background: #fee2e2; color: #b91c1c; padding: 0.75rem; border-radius: 0.375rem; margin-bottom: 1rem; font-size: 0.875rem;">
      {{erro}}
    </div>
    {{/erro}}

    {{#sucesso}}
    <div style="background: #d1fae5; color: #065f46; padding: 0.75rem; border-radius: 0.375rem; margin-bottom: 1rem; font-size: 0.875rem;">
      {{sucesso}}
    </div>
    {{/sucesso}}

    <form action="/login" method="POST">
      <div class="form-group">
        <label class="form-label" for="usuario">Usuário</label>
        <input class="form-input" type="text" id="usuario" name="usuario" required autofocus placeholder="Ex: operador" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label" for="senha">Senha</label>
        <input class="form-input" type="password" id="senha" name="senha" required placeholder="Sua senha" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Entrar no PDV</button>
    </form>
    <div style="text-align: center; margin-top: 1.25rem; font-size: 0.875rem;">
      <a href="/primeiro-acesso" style="color: #059669; font-weight: 600; text-decoration: none;">🔑 Primeiro acesso ou esqueceu a senha? Redefinir com código</a>
    </div>
  </div>
</body>
</html>
