<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PocketPDV - Primeiro Acesso &amp; Recuperação de Senha</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div class="login-box" style="max-width: 420px;">
    <div class="login-header">
      <h1 class="brand">PocketPDV</h1>
      <p style="color: #6b7280; font-size: 0.875rem;">Primeiro Acesso &amp; Recuperação de Senha</p>
    </div>

    {{#erro}}
    <div style="background: #fee2e2; color: #b91c1c; padding: 0.75rem; border-radius: 0.375rem; margin-bottom: 1rem; font-size: 0.875rem;">
      {{erro}}
    </div>
    {{/erro}}

    {{#sucesso}}
    <div style="background: #d1fae5; color: #065f46; padding: 0.75rem; border-radius: 0.375rem; margin-bottom: 1rem; font-size: 0.875rem;">
      {{sucesso}}
    </div>
    {{/sucesso}}

    <form action="/primeiro-acesso" method="POST">
      <div class="form-group">
        <label class="form-label" for="usuario">Usuário</label>
        <input class="form-input" type="text" id="usuario" name="usuario" required autofocus placeholder="Ex: mcosta">
      </div>
      <div class="form-group">
        <label class="form-label" for="codigo">Código de Confirmação (6 dígitos)</label>
        <input class="form-input font-mono" type="text" id="codigo" name="codigo" maxlength="6" required placeholder="Ex: K9P2X4" style="text-transform: uppercase; letter-spacing: 2px; font-weight: bold;">
      </div>
      <div class="form-group">
        <label class="form-label" for="senha">Nova Senha</label>
        <input class="form-input" type="password" id="senha" name="senha" required placeholder="Digite sua nova senha">
      </div>
      <div class="form-group">
        <label class="form-label" for="confirmaSenha">Confirmar Nova Senha</label>
        <input class="form-input" type="password" id="confirmaSenha" name="confirmaSenha" required placeholder="Repita a nova senha">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Definir / Redefinir Senha</button>
    </form>
    <div style="text-align: center; margin-top: 1.25rem; font-size: 0.875rem;">
      <a href="/login" style="color: #6b7280; text-decoration: none;">&larr; Voltar para a tela de login</a>
    </div>
  </div>
</body>
</html>
